l_english:
 MD_2026_WORLD_IN_FRACTURE: "2026: World in Fracture"
 MD_2026_WORLD_IN_FRACTURE_DESC: "January 1, 2026. The old order still stands, but every foundation is under strain. Russia's war in Ukraine grinds onward. The United States enters the second year of Donald Trump's restored presidency as confrontation gathers around Venezuela, Iran, and Cuba. Israel's wars have become a regional system of conflict. Across the Sahel, military governments, separatists, and rival jihadist movements struggle over a widening frontier. History has loaded the chamber. The player chooses where it points."
 USA_2026_BOOKMARK_DESC: "Donald Trump begins the second year of his second presidency with sweeping executive power and an increasingly confrontational foreign policy. Venezuela stands on the edge of an American operation, war with Iran threatens the global economy, and Cuba may become the next test of Washington's reach."
 SOV_2026_BOOKMARK_DESC: "Russia enters another winter of war against Ukraine. Sanctions, casualties, drone warfare, and the demands of a war economy have reshaped the state. Moscow must choose between escalation, endurance, and a settlement that may determine Russia's place in the century."
 UKR_2026_BOOKMARK_DESC: "Ukraine remains sovereign but exhausted. Its survival depends upon mobilization, technological adaptation, domestic legitimacy, and continued foreign support. Every month carries both the possibility of breakthrough and the danger of abandonment."
 PER_2026_BOOKMARK_DESC: "Iran faces domestic pressure, economic isolation, Israeli attacks, and the growing possibility of direct war with the United States. Its nuclear program, regional partners, and control over the Strait of Hormuz give Tehran leverage—but each can also become a road to catastrophe."
 ISR_2026_BOOKMARK_DESC: "Israel enters 2026 amid overlapping wars and unresolved political divisions. Gaza, Lebanon, Syria, and Iran form one connected security crisis. Military dominance may provide temporary safety, but every escalation carries diplomatic, economic, and internal costs."
 VEN_2026_BOOKMARK_DESC: "Nicolás Maduro begins 2026 under extraordinary American pressure. Venezuela's leadership, armed forces, opposition, and oil industry are approaching a moment of decision. Within days, the country may face negotiation, intervention, regime fracture, or war."
 CUB_2026_BOOKMARK_DESC: "Cuba confronts energy shortages, economic crisis, migration, and renewed pressure from Washington. Survival may require reform, a negotiated opening, deeper foreign support, or a final revolutionary stand."
 MAL_2026_BOOKMARK_DESC: "Mali's military government fights for control against JNIM, Islamic State forces, and separatist movements while relying upon the Alliance of Sahel States and Russian support. The war is no longer confined to the desert."
 NGR_2026_BOOKMARK_DESC: "Niger stands at the center of the Sahel's shifting order. The junta must defend its territory, preserve the Alliance of Sahel States, and navigate competing Russian, American, regional, and jihadist pressure."
 BFA_2026_BOOKMARK_DESC: "Burkina Faso faces a struggle for state survival as militant organizations contest broad areas of the country. Mobilization can preserve the revolution—or deepen a war that has already transformed society."
 SYR_2026_BOOKMARK_DESC: "Syria remains fractured by the consequences of civil war, foreign intervention, Kurdish autonomy, Israeli operations, and regional competition. The old settlement is gone; the shape of the next one remains uncertain."
 CHI_2026_BOOKMARK_DESC: "China watches a distracted world while balancing economic strain, technological rivalry, military modernization, and the unresolved question of Taiwan. Patience offers strength, but opportunity may not remain forever."
 TAI_2026_BOOKMARK_DESC: "Taiwan's democracy and semiconductor economy stand at the center of the world's most dangerous great-power rivalry. Deterrence depends upon preparation, international support, and preventing pressure from becoming blockade or invasion."
 PAL_2026_BOOKMARK_DESC: "Palestinian politics, territory, and institutions have been shattered by war. Survival, reconstruction, resistance, diplomacy, and national unity now compete to define what remains possible."
 HAM_2026_BOOKMARK_DESC: "Hamas enters 2026 battered but not erased. Its choices will shape the future of Gaza, Palestinian politics, Israeli strategy, and the wider regional conflict."
 HEZ_2026_BOOKMARK_DESC: "Hezbollah faces Israeli military pressure, Lebanese political constraints, and the consequences of Iran's confrontation with the United States. The movement must decide how much of Lebanon it is willing to risk for the axis it helped build."
 OTHER_2026_BOOKMARK_DESC: "The world of 2026 is connected by debt, energy, trade, migration, technology, and war. Even nations far from the major fronts will be forced to choose how they respond to a fractured international order."
 md2026.2.t: "The World in Fracture"
 md2026.2.d: "January 1, 2026.\n\nThe post-Cold War settlement has come apart. Russia and Ukraine remain locked in an industrial war of drones, trenches, and deep strikes. The United States has entered the second year of Donald Trump's restored presidency while pressure builds against Venezuela, Iran, and Cuba. Israel's conflicts now form a single regional crisis. Across the Sahel, governments and armed movements struggle over a widening frontier.\n\nThe old Millennium Dawn systems remain in place, but the world they govern has changed."
 md2026.2.a: "History has loaded the chamber."
 MD_2026_russian_war_of_attrition: "War of Attrition"
 MD_2026_russian_war_of_attrition_desc: "Years of war have expanded Russia's military production while consuming manpower, equipment, logistics, and political attention. Tactical adaptation has not restored the possibility of an easy victory."
 MD_2026_ukrainian_war_of_survival: "War of National Survival"
 MD_2026_ukrainian_war_of_survival_desc: "Ukraine's society, economy, and armed forces are organized around resisting invasion. Defensive cohesion remains strong, but mobilization, infrastructure damage, and dependence upon foreign support impose growing costs."
 MD_2026_RUSSO_UKRAINIAN_WAR_NAME: "Russian-Ukrainian War"
 MD_2026_conflict_management: "Managing the Russian-Ukrainian War"
 MD_2026_conflict_management_desc: "The front is shaped not only by territory, but by exhaustion, external support, escalation risk, and each government's willingness to negotiate."
 MD_2026_probe_negotiations: "Open a Backchannel"
 MD_2026_probe_negotiations_desc: "Use intermediaries to determine whether the opposing government is willing to discuss terms without publicly committing to concessions."
 MD_2026_propose_armistice: "Propose an Armistice"
 MD_2026_propose_armistice_desc: "Offer to halt active fighting for one year. This ends the immediate war but does not resolve the final legal status of occupied territories."
 md2026.20.t: "An Armistice Proposal"
 md2026.20.d: "The opposing government has offered a one-year halt to active military operations. Accepting would stop the bloodshed and create room for negotiations, but neither side would surrender its territorial claims."
 md2026.20.a: "Silence the guns—for now."
 md2026.20.b: "There can be no ceasefire on these terms."
